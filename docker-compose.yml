services:

  postgres:
    image: postgres:16
    container_name: knowledge_postgres
    environment:
      POSTGRES_DB: knowledge_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: knowledge_backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      POSTGRES_DB: knowledge_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

  frontend:
    build:
      context: ./frontend
    container_name: knowledge_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
